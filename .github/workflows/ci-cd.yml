name: Voa Aguia - CI/CD (Render e Atlas)

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Compilar, testar e construir imagem Docker
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Java 17 e cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build e testes com MongoDB
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Build Docker
        run: docker build --tag voaaguia:${{ github.sha }} .
      - name: Relatorios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-${{ github.run_number }}
          path: target/surefire-reports/
          if-no-files-found: ignore

  staging:
    name: Deploy Render - staging
    needs: build-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    concurrency:
      group: render-voaaguia-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publicar o commit validado e aguardar Render LIVE
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_PUBLIC_URL: ${{ vars.RENDER_PUBLIC_URL }}
        run: bash scripts/render-deploy.sh

  production:
    name: Deploy Render - producao academica
    needs: build-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    concurrency:
      group: render-voaaguia-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publicar o commit validado e aguardar Render LIVE
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_PUBLIC_URL: ${{ vars.RENDER_PUBLIC_URL }}
        run: bash scripts/render-deploy.sh
